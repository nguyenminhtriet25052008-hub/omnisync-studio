<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="omniGradA" x1="4" y1="4" x2="44" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="omniGradB" x1="44" y1="44" x2="4" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="omniGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="48" height="48" rx="10" fill="#0F172A"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="9.5" stroke="#334155" stroke-width="1"/>

  <!-- Top Flow Curve (Left to Right Synchronization) -->
  <path d="M 12 24 C 12 15 17 11 24 11 C 31 11 36 15 36 21" 
        stroke="url(#omniGradA)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrow Head Right -->
  <path d="M 33 17 L 37.5 21.5 L 33 26" 
        stroke="url(#omniGradA)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Flow Curve (Right to Left Synchronization) -->
  <path d="M 36 24 C 36 33 31 37 24 37 C 17 37 12 33 12 27" 
        stroke="url(#omniGradB)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrow Head Left -->
  <path d="M 15 31 L 10.5 26.5 L 15 22" 
        stroke="url(#omniGradB)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Interlocking Data Node Hubs -->
  <circle cx="24" cy="24" r="3.5" fill="#38BDF8" filter="url(#omniGlow)"/>
  <circle cx="24" cy="24" r="1.5" fill="#FFFFFF"/>
</svg>
